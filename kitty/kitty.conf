# ─── LainOS rice para kitty ───
# "Present day... present time..."

include lainos.conf

# fuente: LainOS usa Love LetterTW, pero es proporcional y kitty solo acepta
# monoespaciadas; Courier Prime es la máquina de escribir monoespaciada más parecida.
# kitty trae los símbolos Nerd Font integrados.
font_family      Courier Prime
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        15.0

# ventana
remember_window_size  no
initial_window_width  120c
initial_window_height 36c
window_padding_width  10
hide_window_decorations titlebar-only
macos_titlebar_color  background
background_opacity    0.75
dynamic_background_opacity yes
background_blur       12
confirm_os_window_close 0


# cursor
cursor_shape           beam
cursor_blink_interval  0.75
cursor_stop_blinking_after 0

# scroll
scrollback_lines 50000

# pestañas
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# campana
enable_audio_bell no
visual_bell_duration 0.1

# atajos (los mismos que en LainOS)
map f11              toggle_fullscreen
map ctrl+shift+enter new_os_window
